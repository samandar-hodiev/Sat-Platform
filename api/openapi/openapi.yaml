openapi: 3.1.0
info:
  title: SAT Platform API
  version: "1"
  summary: One REST API for the SAT Platform web app, Owner dashboard, and Android/iOS apps.
  description: |
    Every client uses this same contract. Conventions — envelope, error codes, pagination,
    dates, versioning — are in docs/API.md.

    Each session that adds or changes endpoints updates this file in the same change.
servers:
  - url: http://localhost:8090
    description: Local development
tags:
  - name: health
  - name: meta
  - name: auth
    description: Learner authentication (1.01). Rules and error table in docs/API.md → Auth.
  - name: profile
    description: Learner profile and Profile Setup (2.01). Rules in docs/API.md → Profile.
  - name: onboarding
    description: Learner onboarding answers — goal, schedule, background (2.02). Rules in docs/API.md → Onboarding.
  - name: account
    description: My Profile — editing the profile, email, password, sign-in methods, account deletion (2.10). Rules in docs/API.md → My Profile.
  - name: preferences
    description: Learner appearance settings and dashboard wallpaper (2.11). Rules in docs/API.md → Preferences.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token issued by the auth module (see docs/AUTHENTICATION.md).

  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Optional client trace id (8–64 chars of [A-Za-z0-9._-]); generated when absent and echoed back.
      schema: { type: string, pattern: "^[A-Za-z0-9._-]{8,64}$" }
    ClientPlatform:
      name: X-Client-Platform
      in: header
      required: false
      description: Recorded for diagnostics and session metadata only; it never changes behaviour.
      schema: { type: string, enum: [web, android, ios] }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    ErrorCode:
      type: string
      description: Stable machine-readable code. Clients branch on this, never on `message`.
      enum:
        - BAD_REQUEST
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - CONFLICT
        - PAYLOAD_TOO_LARGE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
          description: For VALIDATION_ERROR, `fields` maps each invalid field to a message.
        request_id: { type: string }
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error: { $ref: "#/components/schemas/ErrorBody" }
    Meta:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    AuthUser:
      type: object
      required: [id, email, role, email_verified, has_password, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [learner] }
        email_verified: { type: boolean }
        has_password: { type: boolean }
        created_at: { type: string, format: date-time }
    AuthSession:
      type: object
      required: [access_token, access_token_expires_at, refresh_token, refresh_token_expires_at, token_type, remember, user, is_new_user]
      properties:
        access_token: { type: string, description: "JWT, 15 minutes. Send as Authorization: Bearer." }
        access_token_expires_at: { type: string, format: date-time }
        refresh_token: { type: string, description: Opaque; rotates on every refresh. Keep in secure storage. }
        refresh_token_expires_at: { type: string, format: date-time }
        token_type: { type: string, const: Bearer }
        remember: { type: boolean }
        user: { $ref: "#/components/schemas/AuthUser" }
        is_new_user: { type: boolean, description: True when the account was just created (continue to Profile Setup). }
    AuthSessionEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: "#/components/schemas/AuthSession" }
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string, maxLength: 256 }
    LearnerProfile:
      type: object
      required: [email, first_name, last_name, phone, date_of_birth, avatar_url, timezone, has_password, password_required, profile_completed, profile_completed_at]
      properties:
        email: { type: string, format: email, description: Verified account email (read-only here). }
        first_name: { type: [string, "null"] }
        last_name: { type: [string, "null"] }
        phone: { type: [string, "null"], description: "E.164, e.g. +998901234567." }
        date_of_birth: { type: [string, "null"], format: date }
        avatar_url: { type: [string, "null"], description: Path on the API origin (prefix the API base URL). Null means the default avatar. }
        timezone: { type: string, description: IANA name. }
        has_password: { type: boolean }
        password_required: { type: boolean, description: Profile Setup must set a password (email account without one). }
        profile_completed: { type: boolean, description: False until Profile Setup is done; clients send the learner to Profile Setup. }
        profile_completed_at: { type: [string, "null"], format: date-time }
    ReauthFields:
      type: object
      description: |
        Confirms a sensitive change (2.10). Send current_password when the account has a password
        (reauth_method "password"); otherwise a code from POST /me/reauth/code (reauth_method "email_code").
      properties:
        current_password: { type: string, maxLength: 512 }
        code: { type: string, pattern: "^[0-9]{6}$" }
    SignInMethods:
      type: object
      required: [email, email_verified, has_password, email_code, reauth_method, google]
      properties:
        email: { type: string, format: email }
        email_verified: { type: boolean }
        has_password: { type: boolean }
        email_code: { type: boolean, const: true, description: Signing in with a code sent to the email always works. }
        reauth_method: { type: string, enum: [password, email_code], description: What sensitive changes ask for. }
        google:
          type: [object, "null"]
          description: The linked Google account, or null.
          required: [email, linked_at]
          properties:
            email: { type: [string, "null"], description: Google email when it was linked. }
            linked_at: { type: string, format: date-time }
    SignInMethodsEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: "#/components/schemas/SignInMethods" }
    ProfileEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: "#/components/schemas/LearnerProfile" }
    OnboardingGoal:
      type: object
      required: [target_score, exam_date, days_until_exam, reason, saved_at]
      properties:
        target_score: { type: integer, minimum: 400, maximum: 1600, multipleOf: 10 }
        exam_date: { type: [string, "null"], format: date, description: Null means the learner has not decided yet. }
        days_until_exam: { type: [integer, "null"], description: "Days from the learner's today (profile time zone); null without an exam date; negative once passed." }
        reason: { type: [string, "null"], enum: [college_admission, scholarship, improve_score, practice, other, null] }
        saved_at: { type: string, format: date-time }
    OnboardingSchedule:
      type: object
      required: [daily_minutes, study_days, saved_at]
      properties:
        daily_minutes: { type: integer, enum: [15, 30, 45, 60, 90, 120], description: 120 means "2 hours or more". }
        study_days: { type: array, items: { type: integer, minimum: 1, maximum: 7 }, minItems: 1, maxItems: 7, description: "ISO weekdays, 1 = Monday … 7 = Sunday, sorted." }
        saved_at: { type: string, format: date-time }
    PreviousScore:
      type: object
      required: [total, math, reading_writing, taken_month]
      properties:
        total: { type: integer, minimum: 400, maximum: 1600, multipleOf: 10 }
        math: { type: [integer, "null"], minimum: 200, maximum: 800, multipleOf: 10 }
        reading_writing: { type: [integer, "null"], minimum: 200, maximum: 800, multipleOf: 10, description: With math, adds up to total. }
        taken_month: { type: [string, "null"], pattern: "^[0-9]{4}-[0-9]{2}$", description: "YYYY-MM, March 2016 to this month." }
    OnboardingBackground:
      type: object
      required: [math_confidence, reading_writing_confidence, previous_score, saved_at]
      properties:
        math_confidence: { type: integer, minimum: 1, maximum: 5 }
        reading_writing_confidence: { type: integer, minimum: 1, maximum: 5 }
        previous_score:
          oneOf:
            - { $ref: "#/components/schemas/PreviousScore" }
            - { type: "null" }
        saved_at: { type: string, format: date-time }
    Onboarding:
      type: object
      required: [completed, completed_at, next_step, goal, schedule, background]
      properties:
        completed: { type: boolean, description: False until onboarding is finished; the web keeps the learner in onboarding. }
        completed_at: { type: [string, "null"], format: date-time }
        next_step: { type: [string, "null"], enum: [goal, schedule, background, null], description: First unsaved step; null when every step is saved. }
        goal:
          description: Null until saved.
          oneOf:
            - { $ref: "#/components/schemas/OnboardingGoal" }
            - { type: "null" }
        schedule:
          description: Null until saved.
          oneOf:
            - { $ref: "#/components/schemas/OnboardingSchedule" }
            - { type: "null" }
        background:
          description: Null until saved.
          oneOf:
            - { $ref: "#/components/schemas/OnboardingBackground" }
            - { type: "null" }
    OnboardingEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: "#/components/schemas/Onboarding" }
    WallpaperChoice:
      type: object
      required: [source, gallery_id, custom_url]
      properties:
        source: { type: string, enum: [none, gallery, custom] }
        gallery_id: { type: [string, "null"], enum: [aurora, dots, grid, waves, contours, peaks, null], description: Set only when source is gallery. }
        custom_url: { type: [string, "null"], description: "The uploaded image of this mode (path on the API origin), also while another source is chosen." }
    Preferences:
      type: object
      required: [theme, accent, density, motion, sidebar_collapsed, wallpaper, stored, updated_at]
      properties:
        theme: { type: string, enum: [light, dark, system] }
        accent: { type: string, enum: [neutral, blue, indigo, violet, teal, rose] }
        density: { type: string, enum: [comfortable, compact] }
        motion: { type: string, enum: [system, reduced, full] }
        sidebar_collapsed: { type: boolean }
        wallpaper:
          type: object
          required: [light, dark, opacity, blur]
          properties:
            light: { $ref: "#/components/schemas/WallpaperChoice" }
            dark: { $ref: "#/components/schemas/WallpaperChoice" }
            opacity: { type: integer, minimum: 10, maximum: 80, description: Percent the wallpaper shows through the page background. }
            blur: { type: integer, minimum: 0, maximum: 20, description: Blur radius in CSS pixels. }
        stored: { type: boolean, description: False while nothing was ever saved (the values are the defaults). }
        updated_at: { type: [string, "null"], format: date-time }
    WallpaperChoiceInput:
      type: object
      required: [source]
      properties:
        source: { type: string, enum: [none, gallery, custom], description: "custom needs an uploaded image of that mode (else 409 wallpaper_not_uploaded)." }
        gallery_id: { type: string, enum: [aurora, dots, grid, waves, contours, peaks], description: Required with source gallery; not allowed otherwise. }
    PreferencesEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: "#/components/schemas/Preferences" }
    CheckResult:
      type: object
      required: [status, latency_ms]
      properties:
        status: { type: string, enum: [up, down] }
        latency_ms: { type: integer }
    ReadinessReport:
      type: object
      required: [status, version, time, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        version: { type: string }
        time: { type: string, format: date-time }
        checks:
          type: object
          additionalProperties: { $ref: "#/components/schemas/CheckResult" }

  responses:
    AuthError:
      description: Client error with a learner-facing message (see docs/API.md → Auth errors).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Too many requests; retry after the Retry-After header.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness — the process is running (no dependency checks)
      responses:
        "200":
          description: The process serves requests.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    properties:
                      status: { type: string, const: ok }
                      version: { type: string }
  /ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness — PostgreSQL answers
      responses:
        "200":
          description: All dependencies are reachable.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: "#/components/schemas/ReadinessReport" }
        "503":
          description: A dependency is down. Error details are never included.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: false }
                  data: { $ref: "#/components/schemas/ReadinessReport" }
                  error: { $ref: "#/components/schemas/ErrorBody" }
  /api/v1/openapi.yaml:
    get:
      tags: [meta]
      operationId: getOpenAPI
      summary: This document
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: OpenAPI 3.1 document.
          content:
            application/yaml:
              schema: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/sign-up/start:
    post:
      tags: [auth]
      operationId: startSignUp
      summary: Email a 6-digit verification code (same answer for new and existing emails)
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Code sent.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [expires_at, resend_available_at]
                    properties:
                      expires_at: { type: string, format: date-time }
                      resend_available_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
        "503": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/sign-up/verify:
    post:
      tags: [auth]
      operationId: verifySignUp
      summary: Verify the code; creates the learner account or signs an existing learner in
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSessionEnvelope" }
        "400": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/sign-in:
    post:
      tags: [auth]
      operationId: signIn
      summary: Sign in with email and password
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, maxLength: 512 }
                remember: { type: boolean, default: false }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSessionEnvelope" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/google:
    post:
      tags: [auth]
      operationId: signInWithGoogle
      summary: Sign in with a Google ID token (web, Android, iOS)
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSessionEnvelope" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
        "503": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh token and get a new token pair
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSessionEnvelope" }
        "401": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the session of the refresh token (idempotent)
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204": { description: Done. }
  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Email a password reset link (always 204)
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "204": { description: Done. }
        "400": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
        "503": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password from a reset link; signs out every session
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: Done. }
        "400": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in user
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [user]
                    properties:
                      user:
                        allOf:
                          - $ref: "#/components/schemas/AuthUser"
                          - type: object
                            required: [has_google]
                            properties:
                              has_google: { type: boolean, description: A Google identity is linked. }
        "401": { $ref: "#/components/responses/AuthError" }
  /api/v1/me/profile:
    get:
      tags: [profile]
      operationId: getMyProfile
      summary: The signed-in learner's profile
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      responses:
        "200":
          description: The profile (empty and incomplete right after sign-up).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileEnvelope" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
    patch:
      tags: [account]
      operationId: updateMyProfile
      summary: Edit the profile (My Profile)
      description: After Profile Setup only (409 reason profile_setup_required before). Absent or null fields stay; phone "" removes the phone. Same rules as Profile Setup.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: [string, "null"], maxLength: 100 }
                last_name: { type: [string, "null"], maxLength: 100 }
                phone: { type: [string, "null"], description: International format, normalized to E.164; "" removes it. }
                date_of_birth: { type: [string, "null"], format: date, description: At least 13 years old. }
                timezone: { type: [string, "null"], description: IANA name. }
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileEnvelope" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
  /api/v1/me/profile/setup:
    put:
      tags: [profile]
      operationId: completeProfileSetup
      summary: Finish Profile Setup (once)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, date_of_birth]
              properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                phone: { type: string, description: Optional; international format, normalized to E.164. }
                date_of_birth: { type: string, format: date, description: At least 13 years old. }
                timezone: { type: string, description: Optional IANA name; empty keeps the current one. }
                password: { type: string, description: "Required when password_required; optional for Google accounts; must be empty when has_password." }
      responses:
        "200":
          description: The completed profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileEnvelope" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
  /api/v1/me/avatar:
    post:
      tags: [profile]
      operationId: uploadAvatar
      summary: Upload a profile picture
      description: JPG, PNG or WebP up to 5 MB in the multipart field "file". Stored as a 512×512 (or smaller) JPEG without metadata. 20 uploads per learner per hour.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: The profile with the new avatar_url.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileEnvelope" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "413": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [profile]
      operationId: removeAvatar
      summary: Go back to the default avatar
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      responses:
        "200":
          description: The profile with avatar_url null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileEnvelope" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
  /api/v1/media/avatars/{user}/{file}:
    get:
      tags: [profile]
      operationId: getAvatarImage
      summary: A stored avatar (public, unguessable URL, cached for a year)
      parameters:
        - { name: user, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: file, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{32}\\.jpg$" } }
      responses:
        "200":
          description: The image.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/AuthError" }
  /api/v1/me/sign-in-methods:
    get:
      tags: [account]
      operationId: getMySignInMethods
      summary: How the learner signs in, and what sensitive changes ask for
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      responses:
        "200":
          description: Sign-in methods.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInMethodsEnvelope" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
  /api/v1/me/reauth/code:
    post:
      tags: [account]
      operationId: sendReauthCode
      summary: Email a confirmation code (accounts without a password)
      description: 10-minute code, 60 s between codes, 10 per day; 5 requests per learner per 10 minutes. 409 when the account has a password (confirm with it instead).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      responses:
        "200":
          description: Code sent to the current email.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [expires_at, resend_available_at]
                    properties:
                      expires_at: { type: string, format: date-time }
                      resend_available_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/AuthError" }
  /api/v1/me/email/change:
    post:
      tags: [account]
      operationId: startEmailChange
      summary: Ask to change the email (sends a code to the new address)
      description: The learner is confirmed first (ReauthFields), then the new address is checked (422 new_email when another account has it).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ReauthFields"
                - type: object
                  required: [new_email]
                  properties:
                    new_email: { type: string, maxLength: 254 }
      responses:
        "200":
          description: Code sent to new_email.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [new_email, expires_at, resend_available_at]
                    properties:
                      new_email: { type: string, format: email }
                      expires_at: { type: string, format: date-time }
                      resend_available_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/AuthError" }
  /api/v1/me/email/change/confirm:
    post:
      tags: [account]
      operationId: confirmEmailChange
      summary: Confirm the new email with its code
      description: Makes the new address the account email, signs out every other session, and notifies the old address.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Updated sign-in methods (new email).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInMethodsEnvelope" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/me/password:
    put:
      tags: [account]
      operationId: changePassword
      summary: Change the password, or set the first one
      description: Confirmed with the current password, or with an email code when the account has none. Signs out every other session.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ReauthFields"
                - type: object
                  required: [new_password]
                  properties:
                    new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: Password saved. }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/me/sign-in-methods/google:
    post:
      tags: [account]
      operationId: linkGoogle
      summary: Link a Google account
      description: id_token from Google Identity Services, plus ReauthFields. 409 when one is linked already or the Google account belongs to another learner.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ReauthFields"
                - type: object
                  required: [id_token]
                  properties:
                    id_token: { type: string, maxLength: 8192 }
      responses:
        "200":
          description: Updated sign-in methods.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInMethodsEnvelope" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/AuthError" }
    delete:
      tags: [account]
      operationId: unlinkGoogle
      summary: Unlink the Google account
      description: Never locks the learner out — the email code always works.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      responses:
        "200":
          description: Updated sign-in methods.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInMethodsEnvelope" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
  /api/v1/me/account:
    delete:
      tags: [account]
      operationId: deleteMyAccount
      summary: Delete the account
      description: |
        Immediate and final. Ends every session, frees the email, removes the profile (name, phone,
        date of birth, avatar) and the sign-in data. Needs confirmation "DELETE" plus ReauthFields.
        10 requests per learner per 10 minutes.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ReauthFields"
                - type: object
                  required: [confirmation]
                  properties:
                    confirmation: { type: string, const: DELETE }
      responses:
        "204": { description: Account deleted. }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/me/onboarding:
    get:
      tags: [onboarding]
      operationId: getMyOnboarding
      summary: The learner's onboarding answers and state
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      responses:
        "200":
          description: Answers so far; steps not saved yet are null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingEnvelope" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
  /api/v1/me/onboarding/goal:
    put:
      tags: [onboarding]
      operationId: saveOnboardingGoal
      summary: Save step 1 — target score, exam date, reason
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_score]
              properties:
                target_score: { type: integer, minimum: 400, maximum: 1600, multipleOf: 10 }
                exam_date: { type: [string, "null"], format: date, description: "Today (learner's time zone) to 2 years ahead; null or omitted = undecided." }
                reason: { type: [string, "null"], enum: [college_admission, scholarship, improve_score, practice, other, null] }
      responses:
        "200":
          description: The onboarding state after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingEnvelope" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
  /api/v1/me/onboarding/schedule:
    put:
      tags: [onboarding]
      operationId: saveOnboardingSchedule
      summary: Save step 2 — daily study time and study days
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [daily_minutes, study_days]
              properties:
                daily_minutes: { type: integer, enum: [15, 30, 45, 60, 90, 120] }
                study_days: { type: array, items: { type: integer, minimum: 1, maximum: 7 }, minItems: 1, maxItems: 14, description: Repeats are dropped. }
      responses:
        "200":
          description: The onboarding state after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingEnvelope" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
  /api/v1/me/onboarding/background:
    put:
      tags: [onboarding]
      operationId: saveOnboardingBackground
      summary: Save step 3 — confidence and an earlier SAT result
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [math_confidence, reading_writing_confidence]
              properties:
                math_confidence: { type: integer, minimum: 1, maximum: 5 }
                reading_writing_confidence: { type: integer, minimum: 1, maximum: 5 }
                previous_score:
                  description: Optional; null or omitted clears it.
                  oneOf:
                    - type: object
                      required: [total]
                      properties:
                        total: { type: integer, minimum: 400, maximum: 1600, multipleOf: 10 }
                        math: { type: [integer, "null"], minimum: 200, maximum: 800, multipleOf: 10 }
                        reading_writing: { type: [integer, "null"], minimum: 200, maximum: 800, multipleOf: 10 }
                        taken_month: { type: [string, "null"], pattern: "^[0-9]{4}-[0-9]{2}$" }
                    - { type: "null" }
      responses:
        "200":
          description: The onboarding state after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingEnvelope" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
  /api/v1/me/onboarding/complete:
    post:
      tags: [onboarding]
      operationId: completeOnboarding
      summary: Finish onboarding (every step saved; idempotent)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      responses:
        "200":
          description: The finished onboarding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingEnvelope" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
  /api/v1/me/preferences:
    get:
      tags: [preferences]
      operationId: getMyPreferences
      summary: The learner's appearance settings (defaults with stored=false when never saved)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      responses:
        "200":
          description: The preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferencesEnvelope" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
    patch:
      tags: [preferences]
      operationId: updateMyPreferences
      summary: Change some appearance settings; fields not sent keep their value
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                theme: { type: string, enum: [light, dark, system] }
                accent: { type: string, enum: [neutral, blue, indigo, violet, teal, rose] }
                density: { type: string, enum: [comfortable, compact] }
                motion: { type: string, enum: [system, reduced, full] }
                sidebar_collapsed: { type: boolean }
                wallpaper:
                  type: object
                  properties:
                    light: { $ref: "#/components/schemas/WallpaperChoiceInput" }
                    dark: { $ref: "#/components/schemas/WallpaperChoiceInput" }
                    opacity: { type: integer, minimum: 10, maximum: 80 }
                    blur: { type: integer, minimum: 0, maximum: 20 }
      responses:
        "200":
          description: The updated preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferencesEnvelope" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
  /api/v1/me/wallpapers/{mode}:
    post:
      tags: [preferences]
      operationId: uploadWallpaper
      summary: Upload the wallpaper image of a mode and choose it
      description: JPG, PNG or WebP up to 8 MB in the multipart field "file". Stored as a JPEG of at most 2560 px on the longest side, without metadata; replaces the previous upload of that mode. 20 uploads per learner per hour.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
        - { name: mode, in: path, required: true, schema: { type: string, enum: [light, dark] } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: The preferences with the new custom_url selected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferencesEnvelope" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
        "413": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [preferences]
      operationId: removeWallpaper
      summary: Delete the uploaded image of a mode (falls back to no wallpaper if it was chosen)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
        - { name: mode, in: path, required: true, schema: { type: string, enum: [light, dark] } }
      responses:
        "200":
          description: The preferences without that upload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferencesEnvelope" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
  /api/v1/media/wallpapers/{user}/{file}:
    get:
      tags: [preferences]
      operationId: getWallpaperImage
      summary: A stored wallpaper (public, unguessable URL, cached for a year)
      parameters:
        - { name: user, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: file, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{32}\\.jpg$" } }
      responses:
        "200":
          description: The image.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/AuthError" }
