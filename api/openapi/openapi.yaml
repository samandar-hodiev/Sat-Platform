openapi: 3.1.0
info:
  title: SAT Platform API
  version: "1"
  summary: One REST API for the SAT Platform web app, Owner dashboard, and Android/iOS apps.
  description: |
    Every client uses this same contract. Conventions — envelope, error codes, pagination,
    dates, versioning — are in docs/API.md.

    Each session that adds or changes endpoints updates this file in the same change.
servers:
  - url: http://localhost:8090
    description: Local development
tags:
  - name: health
  - name: meta

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token issued by the auth module (see docs/AUTHENTICATION.md).

  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Optional client trace id (8–64 chars of [A-Za-z0-9._-]); generated when absent and echoed back.
      schema: { type: string, pattern: "^[A-Za-z0-9._-]{8,64}$" }
    ClientPlatform:
      name: X-Client-Platform
      in: header
      required: false
      description: Recorded for diagnostics and session metadata only; it never changes behaviour.
      schema: { type: string, enum: [web, android, ios] }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    ErrorCode:
      type: string
      description: Stable machine-readable code. Clients branch on this, never on `message`.
      enum:
        - BAD_REQUEST
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - CONFLICT
        - PAYLOAD_TOO_LARGE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
          description: For VALIDATION_ERROR, `fields` maps each invalid field to a message.
        request_id: { type: string }
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error: { $ref: "#/components/schemas/ErrorBody" }
    Meta:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    CheckResult:
      type: object
      required: [status, latency_ms]
      properties:
        status: { type: string, enum: [up, down] }
        latency_ms: { type: integer }
    ReadinessReport:
      type: object
      required: [status, version, time, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        version: { type: string }
        time: { type: string, format: date-time }
        checks:
          type: object
          additionalProperties: { $ref: "#/components/schemas/CheckResult" }

  responses:
    RateLimited:
      description: Too many requests; retry after the Retry-After header.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness — the process is running (no dependency checks)
      responses:
        "200":
          description: The process serves requests.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    properties:
                      status: { type: string, const: ok }
                      version: { type: string }
  /ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness — PostgreSQL answers
      responses:
        "200":
          description: All dependencies are reachable.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: "#/components/schemas/ReadinessReport" }
        "503":
          description: A dependency is down. Error details are never included.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { type: boolean, const: false }
                  data: { $ref: "#/components/schemas/ReadinessReport" }
                  error: { $ref: "#/components/schemas/ErrorBody" }
  /api/v1/openapi.yaml:
    get:
      tags: [meta]
      operationId: getOpenAPI
      summary: This document
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: OpenAPI 3.1 document.
          content:
            application/yaml:
              schema: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }
